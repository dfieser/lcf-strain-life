name: publish

# Publishes when a version tag (vX.Y.Z) is pushed. Four jobs run:
# 1. build and upload to PyPI via Trusted Publishing (OIDC), no stored token.
# 2. list the server in the official MCP Registry via GitHub OIDC, after the
#    PyPI upload it validates against.
# 3. create the GitHub Release, which triggers the Zenodo archiver and DOI
#    when the Zenodo GitHub integration is switched on for this repository.
# 4. build the Windows desktop app for the graphical interface with the same
#    scripts/build_gui_app.py used locally, and attach the exe to the release.
# To release: bump the version, update the changelog, commit, then
# `git tag vX.Y.Z && git push origin vX.Y.Z`. The full release process is
# documented in the maintainer notes outside this repository.
#
# One-time setup required first: a PyPI trusted publisher with this repo, the
# workflow filename publish.yml, and the environment name pypi, plus the
# Zenodo GitHub toggle for this repository.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: build and upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi          # must match the trusted-publisher config on PyPI
    permissions:
      id-token: write          # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Lists the server in the official MCP Registry after the PyPI upload.
    # Authentication is GitHub OIDC, no stored token. Ownership of the PyPI
    # package is proven by the mcp-name marker in the README, which PyPI
    # serves as the package description.
    name: publish to the MCP Registry
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      id-token: write          # required for OIDC login to the registry
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set the tag version in server.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" \
            '.version = $v
             | .packages[0].version = $v
             | .packages[0].runtimeArguments[0].value = "lcf-strain-life[mcp]==" + $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Wait until PyPI serves the new version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for i in $(seq 1 20); do
            if curl -fsSL "https://pypi.org/pypi/lcf-strain-life/json" \
              | jq -e --arg v "$VERSION" '.releases[$v]' > /dev/null; then
              echo "PyPI serves $VERSION"; exit 0
            fi
            echo "not yet, retry $i"; sleep 30
          done
          echo "PyPI never served $VERSION"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

  github-release:
    name: create GitHub release (triggers Zenodo)
    runs-on: ubuntu-latest
    needs: publish             # only cut a release if the PyPI upload succeeded
    permissions:
      contents: write          # required to create the release
    steps:
      - uses: actions/checkout@v7
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  windows-app:
    # The desktop build is unsigned. Windows SmartScreen warns on first run
    # until the app is code signed, and the download page must say so.
    name: build the Windows desktop app
    runs-on: windows-latest
    needs: github-release      # the release must exist before uploading to it
    permissions:
      contents: write          # required to upload the release asset
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the package with the gui extra and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[mcp,gui]" pyinstaller
      - name: Build the one-file exe
        run: python scripts/build_gui_app.py
      - name: Attach the exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item lcf-strain-life-app.exe "lcf-strain-life-app-windows-$env:GITHUB_REF_NAME.exe"
          gh release upload "$env:GITHUB_REF_NAME" "lcf-strain-life-app-windows-$env:GITHUB_REF_NAME.exe"
